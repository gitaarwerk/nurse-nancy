package-as: NurseNancy

enable-nolib-creation: no

move-folders:
  NurseNancy/public: NurseNancy

ignore: # Files and directories beginning with a dot (such as .git) are automatically ignored, as is the pgkmeta file itself.
  - LICENSE
  - README.md
  - pkgmeta.yaml
  - .gitignore
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - tests
  - pnpm-lock.yaml
  - public/Src
  - .idea
  - .vscode
  - .DS_Store

license-output: LICENSE.txt
